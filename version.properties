# Flux Launcher Versioning Configuration
#
# WHY IN-PLACE UPDATES FAILED PREVIOUSLY:
# Android's PackageInstaller strictly requires every new APK to have a higher `versionCode`
# than the currently installed version on the device (newVersionCode > oldVersionCode).
# When versionCode was hardcoded to 1 (and later pinned at 2), Android rejected in-place
# updates, forcing a full uninstall/reinstall and losing per-device configuration.
#
# HOW IT WORKS NOW:
# By default, when `versionCode` is commented out below, the build system automatically computes
# a monotonically increasing timestamp-based versionCode for every build. This guarantees that
# every APK you build and download will seamlessly update in-place over the installed app,
# preserving all your custom settings, favorites, dock, and widget configurations.
#
# The auto value is `(((epochSeconds) - 1700000000) / 10)`, floored at MIN_VERSION_CODE (2)
# so it is always strictly higher than any previously shipped build. It is also strictly
# greater than the old pinned `versionCode=2` shipped in v1.0.1.
#
# NOTE (signing key change): the first build signed with the NEW persistent release key
# requires a ONE-TIME manual uninstall of the previously installed app. After that one-time
# uninstall, every future build installs and updates in place normally. See docs/RELEASE.md.
#
# If you wish to pin or manually set a specific version, uncomment the lines below
# (the value must always be higher than the highest versionCode ever installed on a device):
#versionCode=2
#versionName=1.0.1
