# Flux Launcher Versioning Configuration
#
# WHY IN-PLACE UPDATES FAILED PREVIOUSLY:
# Android's PackageInstaller strictly requires every new APK to have a higher `versionCode`
# than the currently installed version on the device (newVersionCode > oldVersionCode).
# When versionCode was hardcoded to 1, Android rejected in-place updates, forcing a full uninstall.
#
# HOW IT WORKS NOW:
# By default, when `versionCode` is commented out below, the build system automatically computes
# a monotonically increasing timestamp-based versionCode for every build. This guarantees that
# every APK you build and download will seamlessly update in-place over the installed app,
# preserving all your custom settings, favorites, dock, and widget configurations.
#
# If you wish to pin or manually set a specific version, uncomment the lines below:
# versionCode=100
# versionName=1.0.0
