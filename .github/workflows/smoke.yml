name: Smoke

# LAUNCH VALIDATION in CI (AGENTS.md rule 3: never verify locally).
# Boots an Android 15 (API 35) emulator step-by-step (full log visibility),
# installs the debug APK, launches the launcher activity, and FAILS if the
# app crashes on open (logcat FATAL check). Regression gate for launch crashes.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_ref:
        description: "Branch/tag to build from"
        required: false
        default: "main"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launch:
    name: Launch on API 35 (Android 15)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Ensure debug keystore (signing config requirement)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storetype JKS -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Locate / install cmdline-tools + system image (fail-loud)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKM" ]; then
            echo "cmdline-tools missing — installing..."
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "$SDK/cmdline-tools" /tmp/clt
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/clt/cmdline-tools/* "$SDK/cmdline-tools/latest/"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install --sdk_root="$SDK" platform-tools emulator "system-images;android-35;google_apis;x86_64" > /tmp/sdk_install.log 2>&1 || { tail -n 30 /tmp/sdk_install.log; exit 1; }
          tail -n 3 /tmp/sdk_install.log
          test -d "$SDK/system-images/android-35" || { echo "::error::system image missing after install"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          echo "system image OK at $SDK/system-images/android-35"

      - name: Create AVD (verify ini exists — emulator needs ANDROID_AVD_HOME)
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke35 -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/smoke35.ini" || { echo "::error::smoke35.ini missing"; "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd; exit 1; }
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "AVD created at $ANDROID_AVD_HOME/smoke35.ini"

      - name: Boot emulator (8 min guard, live progress)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          adb start-server
          $ANDROID_HOME/emulator/emulator -avd smoke35 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -cores 4 \
            -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | head -n 4 || true
          for i in $(seq 1 84); do
            sleep 10
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "t=$((i*10))s boot_completed=${B:-0}"
            [ "$B" = "1" ] && break
          done
          [ "$B" = "1" ] || { echo "EMU BOOT FAILED — last 80 log lines:"; tail -n 80 /tmp/emulator.log; kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true; exit 1; }

      - name: Install + launch + crash gate
        run: |
          adb install -r -t app/build/outputs/apk/debug/*.apk
          adb logcat -c
          adb shell am start -W -n com.aistudio.fluxlauncher.vknwre/com.example.MainActivity || true
          sleep 15
          CRASHES=$(timeout 90 adb logcat -d 2>/dev/null | grep -E "FATAL EXCEPTION|Force finishing activity com.aistudio" | head -n 40 || true)
          if [ -n "$CRASHES" ]; then
            echo "::error::APP CRASHED ON LAUNCH"
            echo "$CRASHES"
            timeout 90 adb logcat -d > smoke-logcat.txt
            exit 1
          fi
          ALIVE=$(adb shell pidof com.aistudio.fluxlauncher.vknwre | tr -d '\r')
          [ -n "$ALIVE" ] && echo "SMOKE OK — process alive (pid $ALIVE), no fatal exceptions" || {
            echo "::error::APP PROCESS NOT RUNNING after launch"; timeout 90 adb logcat -d 2>/dev/null | tail -n 80 > smoke-logcat.txt || true; exit 1; }

      - name: Upload smoke logcat (always)
        if: always()
        run: timeout 90 adb logcat -d > smoke-logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: smoke-logcat.txt
          retention-days: 7
