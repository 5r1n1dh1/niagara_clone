name: Test

# Unit tests — runs IN PARALLEL with build.yml / lint.yml / smoke.yml.
# Targeted: pass `module` on workflow_dispatch (e.g. ":feature:home") to test
# just that module; leave empty to test everything. Path-filtered triggers
# keep quota usage proportional to the change.

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "design/**", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "design/**", "docs/**"]
  workflow_dispatch:
    inputs:
      module:
        description: "Gradle module to test (empty = all), e.g. :feature:home"
        required: false
        default: ""

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests ${{ inputs.module || '(all)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (targeted)
        run: ./gradlew ${{ inputs.module || ':app' }}:testDebugUnitTest --no-daemon --continue
        id: tests

      # When a single module is targeted, also run the rest (parallel-friendly
      # full sweep) only on explicit all-run; targeted runs stay fast.
      - name: Run unit tests (all modules)
        if: inputs.module == ''
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      - name: Upload test reports (always, for triage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
