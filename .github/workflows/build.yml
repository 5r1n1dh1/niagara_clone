name: Build

# Builds installable APKs. Runs IN PARALLEL with test.yml / lint.yml / smoke.yml.
# Heavy by design: push to main + tags + explicit dispatch only (quota-safe).

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "design/**", "docs/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "design/**", "docs/**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type to build"
        required: true
        default: "both"
        type: choice
        options: [debug, release, both]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: APK (${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      - name: Determine build type
        id: bt
        run: |
          if [ -n "${{ inputs.build_type }}" ]; then echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "type=release" >> $GITHUB_OUTPUT
          else echo "type=debug" >> $GITHUB_OUTPUT; fi

      - name: Build Debug APK
        if: steps.bt.outputs.type != 'release'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK (signed via secrets)
        if: steps.bt.outputs.type != 'debug'
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          ./gradlew :app:assembleRelease --no-daemon

      - name: Normalise artifact name (flux.apk / flux-debug.apk)
        id: names
        run: |
          R=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n1 || true)
          D=$(find app/build/outputs/apk/debug   -name "*.apk" 2>/dev/null | head -n1 || true)
          [ -n "$R" ] && cp "$R" flux.apk
          [ -n "$D" ] && cp "$D" flux-debug.apk
          ls -lh flux*.apk 2>/dev/null || true

      - name: Upload release flux.apk artifact
        if: hashFiles('flux.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flux-apk
          path: flux.apk
          retention-days: 14

      - name: Upload debug artifact
        if: hashFiles('flux-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flux-debug-apk
          path: flux-debug.apk
          retention-days: 7
